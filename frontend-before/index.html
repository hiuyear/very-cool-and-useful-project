<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Devpost Talent Finder</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-[#f7f5f2] text-gray-900 font-sans overflow-x-hidden">

    <!-- Header Section -->
    <header class="w-full py-6 px-10 flex justify-between items-center bg-white/60 backdrop-blur-md shadow-sm fixed top-0 z-50">
      <h1 class="text-2xl font-bold">Devpost Talent Finder</h1>
      <a href="search.html">
        <button class="bg-black text-white px-6 py-2 rounded-full text-sm hover:bg-gray-800 transition">Search</button>
      </a>
    </header>

    <!-- Hero Section -->
    <section class="w-full min-h-screen pt-32 pb-20 flex flex-col justify-center items-center text-center px-4">
      <!-- Floating Emojis -->
      <div class="flex justify-center space-x-12 mb-10 animate-fade-in">
        <div class="text-6xl">💼</div>
        <div class="text-6xl">🔎</div>
        <div class="text-6xl">👩🏻‍💻</div>
      </div>

      <!-- Text Bubbles -->
      <div class="space-y-6 max-w-2xl">
        <div class="bg-[#f3e9dc] px-6 py-4 rounded-2xl relative shadow-md">
          <span class="absolute left-[-10px] top-4 w-0 h-0 border-t-8 border-b-8 border-r-8 border-transparent border-r-[#f3e9dc]"></span>
          <p class="text-lg">Are you an employer?</p>
        </div>
        <div class="bg-[#f3e9dc] px-6 py-4 rounded-2xl relative shadow-md">
          <span class="absolute right-[-10px] top-4 w-0 h-0 border-t-8 border-b-8 border-l-8 border-transparent border-l-[#f3e9dc]"></span>
          <p class="text-lg">Tired of exaggerated skillsets by CS students?</p>
        </div>
        <div class="bg-[#f3e9dc] px-6 py-4 rounded-2xl relative shadow-md">
          <span class="absolute left-[-10px] top-4 w-0 h-0 border-t-8 border-b-8 border-r-8 border-transparent border-r-[#f3e9dc]"></span>
          <p class="text-lg">Discover potential tech hires based on real projects and Devpost hackathon results.</p>
        </div>
      </div>

      <!-- CTA Button -->
      <div class="mt-12">
        <a href="search.html">
          <button class="bg-black text-white text-lg px-10 py-4 rounded-full shadow-lg hover:bg-gray-800 transition">Start Searching</button>
        </a>
      </div>
    </section>

  </body>
</html>
